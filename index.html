<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For ZXY ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 继续沿用神秘感十足的暗调琥珀背景 */
            background: linear-gradient(135deg, #181514 0%, #2d2421 50%, #121010 100%); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            color: #e5dada;
        }

        .container {
            text-align: center;
            background: rgba(35, 30, 28, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 0 1px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            z-index: 10;
            width: 90%;
            max-width: 420px;
            margin: 20px;
            border: 1px solid rgba(212, 175, 55, 0.15); 
            transition: all 0.5s ease;
        }

        /* 毕业合影照片框 - 沿用大写文件名 IMG_7662.JPG */
        .photo-area {
            width: 100%;
            height: 350px;
            margin: 0 auto 25px;
            border-radius: 12px;
            background-image: url('IMG_7662.JPG'); 
            background-size: cover;
            background-position: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            filter: brightness(0.95) contrast(1.05); 
        }

        .tag {
            display: inline-block;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #d4af37; 
            margin-bottom: 10px;
            opacity: 0.9;
        }

        h1 {
            color: #f3ece7;
            font-size: 1.8rem;
            margin-bottom: 18px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        p {
            color: #b8acA6;
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 0px;
            text-align: left;
        }

        .highlight {
            color: #e6b89c; 
            font-weight: 600;
        }

        .signature {
            font-weight: 500;
            color: #d4af37;
            text-align: right;
            display: block;
            margin-top: 20px;
            letter-spacing: 1px;
        }

        .buttons {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
        }

        .btn {
            padding: 12px 32px;
            font-size: 1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 500;
            letter-spacing: 1px;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
        }

        #yes-btn {
            background: linear-gradient(135deg, #c99a6e 0%, #a27448 100%);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(162, 116, 72, 0.3);
        }

        #yes-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(162, 116, 72, 0.4);
        }

        #no-btn {
            background-color: transparent;
            color: #7a6e68;
            border: 1px solid #4a403a;
            position: relative;
        }

        /* 浮动氛围微光粒子 */
        .ember {
            position: absolute;
            color: #d4af37;
            font-size: 12px;
            animation: floatUp 4s ease-in infinite;
            opacity: 0;
            z-index: 1;
            filter: blur(0.5px);
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <div class="photo-area"></div>
        
        <span class="tag">PROJECT AROMA</span>
        <h1 id="title">Babe，该出去走走了 🕯️</h1>
        <p id="desc">
            这周六（<span class="highlight">8月8日</span>），请把时间留给我。
            <br><br>
            我们要去进行一场关于气味与直觉的秘密探索。至于晚餐吃什么，这个最终谜底，将由你那天给出的答案来决定。
            <br>
            <span class="signature" id="sig">—— LJC</span>
        </p>
        <div class="buttons">
            <button class="btn" id="yes-btn">解锁谜底 ✨</button>
            <button class="btn" id="no-btn">不要 😜</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const title = document.getElementById('title');
        const desc = document.getElementById('desc');
        const sig = document.getElementById('sig');

        // 1. 避让逻辑
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', moveButton); 

        function moveButton(e) {
            e.preventDefault(); 
            const padding = 50;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            if (noBtn.style.position !== 'absolute') {
                noBtn.style.position = 'absolute';
            }

            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // 2. 约定达成
        yesBtn.addEventListener('click', () => {
            title.innerHTML = "Babe ❤️<br>绝密约定达成 🗝️";
            desc.innerHTML = "<div style='text-align:center;'>8月8日 周六<br><br>带上你的嗅觉与直觉，剩下的全交给我。<br>不见不散。</div>";
            sig.style.display = 'none'; 
            noBtn.style.display = 'none'; 
            yesBtn.style.display = 'none'; 
            
            // 触发金色星光粒子
            setInterval(createEmber, 120);
        });

        // 3. 微光浮动特效
        function createEmber() {
            const ember = document.createElement('div');
            ember.classList.add('ember');
            ember.innerHTML = '✦'; 
            ember.style.left = Math.random() * 100 + 'vw';
            ember.style.animationDuration = Math.random() * 3 + 3 + 's'; 
            ember.style.fontSize = Math.random() * 10 + 10 + 'px';
            document.body.appendChild(ember);

            setTimeout(() => {
                ember.remove();
            }, 6000);
        }

        // 初始背景微光
        setInterval(createEmber, 1500);
    </script>
</body>
</html>
